    <!-- v5.5.7 - Theme detection (runs before paint to prevent flash) -->
    <script>
        (function() {
            var stored = localStorage.getItem('readerwrangler-theme');
            var theme = stored;
            if (!stored || stored === 'auto') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (theme && theme !== 'light') {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>

    <!-- v5.5.11 - Splash screen styles (no Tailwind dependency) -->
    <style>
        @keyframes splash-spin {
            to { transform: rotate(360deg); }
        }
        .splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-default, #e2e8f0);
            border-top-color: var(--bg-accent, #3b82f6);
            border-radius: 50%;

        .splash-msgs {
            position: relative;
            width: 400px;
            max-width: 90vw;
            height: 1.4em;
            margin-bottom: 24px;
        }
        .splash-msgs span {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            opacity: 0;
            animation: splash-fade 24s infinite;
        }
        @keyframes splash-fade {
            0%, 1% { opacity: 0; }
            2%, 10.5% { opacity: 1; }

        [data-theme="dark"] #splash img,

            <script>
                (function() {

                        "Unbury your next great read.", "Organizing the chaos into a system.",
                        "See all your books in one place.", "Folders, tags, and total control.",

                        "Take command of your reading life.", "A file manager for your reading list.",
                        "Tag from Collections: curation you rent becomes curation you own."
                    ];
                    var banter = [
                        "Shelving your books...", "Taming the chaos...", "Organizing the stacks...",
                        "Dusting the shelves...", "Alphabetizing the spines...", "Sorting by series order...",
                        "Herding stray paperbacks...", "Untangling your reading list...",
                        "Rescuing buried favorites...", "Shushing the noisy ones...",
                        "Checking books in...", "Cataloging the collection...",
                        "Straightening the bookends...", "Pressing the dog-ears flat...",
                        "Evicting the bookworms...", "Waking the librarian...",
                        "Brewing a reading-sized coffee...", "Finding your bookmark..."
                    ];
                    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.random() * (i + 1) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; } }

    <!-- v7.4.0 - Capture the first load error so the emergency screen can SHOW it on localhost
         (a dev's 'Something went wrong' is usually a syntax error, not corrupted data) -->
    <script>
        window.addEventListener('error', function(e) {
            if (window._lastLoadError) return; // first error is the story
            if (e && e.message) {
                window._lastLoadError = e.message + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '');
            } else if (e && e.target && e.target.src) {
                window._lastLoadError = 'Failed to load: ' + e.target.src.split('/').pop().split('?')[0];
            }
        }, true);
    </script>

    <!-- Main app (built ahead of time into dist/ — 7.27.0) - Dynamic loading for cache busting -->
    <script>
        // APP_VERSION - Single source of truth for cache busting
        // Update this on each release to force browsers to fetch new code
        const APP_VERSION = "7.28.1";

        // v7.21.2 - Every year the code actually changed, listed — About shows "Copyright © ‹this›". A list, not a range:
        // a year with no changes is skipped (a range like 2025–2030 would claim the gap years too), and nothing is
        // claimed for years the code sat still. The commit check (git-hooks/version-guard.py) refuses a commit that
        // changes shipped code in a year that isn't the LAST one listed — append it (", 2027") in that commit.
        const COPYRIGHT_YEARS = "2025, 2026";

        // v7.21.0 - THE environment answers (contributor mode — spec in TODO.md, Ron 2026-10-06). Defined ONCE, here,
        // before ANY app code loads (desktop app, mobile.js, storage.js all run after this); everything else ASKS these —
        // nothing re-reads the address bar or the flag. Two kinds of local-server users: SELF-HOSTERS get production
        // behavior, silently; CONTRIBUTORS (local server AND this browser's flag) get all dev behavior. The badge
        // ("LOCAL · CONTRIBUTOR" vs "LOCAL") is the fail-safe that shows which you are.
        //   isLocalServer()    — this PC or a phone on the home network hitting it (localhost / 127.0.0.1 / 10.x / 192.168.x)
        //   isDevSite()        — the readerwranglerdev GitHub Pages site
        //   isContributor()    — local server AND readerwrangler-contributor = on (always false elsewhere)
        //   isTestingTraffic() — contributor OR dev site: labels usage statistics "dev-" instead of "prod-"
        const CONTRIBUTOR_KEY = 'readerwrangler-contributor';
        function isLocalServer() { var h = location.hostname; return h === 'localhost' || h === '127.0.0.1' || /^(10|192\.168)\./.test(h); }
        function isDevSite() { return location.hostname === 'ron-l.github.io' && location.pathname.indexOf('/readerwranglerdev') === 0; }
        function isContributor() {
            if (!isLocalServer()) return false;
            try { return localStorage.getItem(CONTRIBUTOR_KEY) === 'on'; } catch (e) { return false; }
        }
        function isTestingTraffic() { return isContributor() || isDevSite(); }
        // v7.21.0 (Ron) - THE usage-statistics event: every app event goes through here, labeled "prod-" (real use:
        // readerwrangler.com AND self-hosters) or "dev-" (testing: contributor mode or the dev site). Unlabeled events in
        // the history are pre-7.21.0 and mixed — read them as such. (Page views are separate: GoatCounter's script
        // already ignores local addresses, and the dev site records under its own /readerwranglerdev/ path.)
        function trackEvent(name) {
            try { new Image().src = 'https://readerwrangler.goatcounter.com/count?p=/event/' + (isTestingTraffic() ? 'dev-' : 'prod-') + name; }
            catch (e) { /* statistics are best-effort */ }
        }
        // The switch: open the app once with ?contributor=on (or =off) — saved in THIS browser for this address+port,
        // then removed from the address bar. Ignored anywhere but a local server.
        (function () {
            try {
                var p = new URLSearchParams(location.search).get('contributor');
                if (p !== 'on' && p !== 'off') return;
                if (isLocalServer()) {
                    if (p === 'on') localStorage.setItem(CONTRIBUTOR_KEY, 'on'); else localStorage.removeItem(CONTRIBUTOR_KEY);
                }
                var u = new URL(location.href); u.searchParams.delete('contributor');
                history.replaceState(null, '', u.pathname + u.search + u.hash);
            } catch (e) { /* storage blocked: the badge will show plain LOCAL — the fail-safe */ }
        })();

        // Viewport detection: load mobile.js on phone-width screens
        // Session guard: once desktop loads in a tab, it stays desktop for that session
        // (prevents accidental mobile switch on browser resize + reload)
        const forceDesktop = localStorage.getItem('readerwrangler-desktopMode') === 'true';
        const sessionMode = sessionStorage.getItem('readerwrangler-sessionMode');
        const isMobileViewport = window.matchMedia('(max-width: 767px)').matches;

        // Interstitial: mobile viewport + desktopMode flag → ask user before loading
        if (forceDesktop && isMobileViewport && sessionMode !== 'desktop') {
            var splash = document.getElementById('splash');
            if (splash) {
                splash.innerHTML =
                    '<div style="text-align:center; padding:40px 20px; max-width:360px;">' +
                        '<img src="icons/logo-transparent.png" alt="" style="width:64px; height:64px; margin-bottom:16px;">' +
                        '<div style="font-family:\'Libre Baskerville\',Georgia,serif; font-size:1.5em; font-weight:700; color:var(--text-primary,#1e293b); margin-bottom:24px;">ReaderWrangler\u2122</div>' +
                        '<div style="color:var(--text-secondary,#475569); font-size:0.95em; line-height:1.6; margin-bottom:28px;">' +
                            'You previously switched to desktop mode on this device.' +
                        '</div>' +
                        '<button id="revertMobileBtn" style="display:block; width:100%; padding:14px; margin-bottom:12px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:12px; font-size:1.05em; font-weight:600; cursor:pointer;">Return to Mobile Mode</button>' +
                        '<button id="continueDesktopBtn" style="display:block; width:100%; padding:14px; background:var(--bg-muted,#f1f5f9); color:var(--text-primary,#1e293b); border:1px solid var(--border-default,#e2e8f0); border-radius:12px; font-size:1em; cursor:pointer;">Continue in Desktop Mode</button>' +
                    '</div>';
                document.getElementById('revertMobileBtn').addEventListener('click', function() {
                    localStorage.removeItem('readerwrangler-desktopMode');
                    sessionStorage.removeItem('readerwrangler-sessionMode');
                    location.reload();
                });
                document.getElementById('continueDesktopBtn').addEventListener('click', function() {
                    sessionStorage.setItem('readerwrangler-sessionMode', 'desktop');
                    location.reload();
                });
            }
        } else {
            // Normal flow: determine mode and load app
            // Priority: forceDesktop flag > session lock > viewport detection
            var isMobile = !forceDesktop && (sessionMode === 'mobile' || (sessionMode !== 'desktop' && isMobileViewport));

            // Lock mode for this session (prevents resize+reload from switching)
            sessionStorage.setItem('readerwrangler-sessionMode', isMobile ? 'mobile' : 'desktop');

            // Dynamically load the appropriate app with version-based cache busting
            window._appLoading = true; // Signal to emergency reset timer
            window._appTimeout = isMobile ? 45000 : 15000; // phones are slower (set when the page compiled in the browser)
            var script = document.createElement('script');
            // 7.27.0 - a plain script: the BUILT copy in dist/ (tools/build.py; serve.py rebuilds it when the source
            // changes). Was type text/babel, compiled here on every load.
            // v7.18.0-alpha.53 - On a LOCAL dev server (this PC, or a phone on the home LAN hitting it) use a fresh
            // stamp per load: APP_VERSION doesn't move between alphas, so the browser could reuse a stale copy and a
            // hard refresh sometimes didn't fetch the new one (2026-10-06 stale-page false bug). Harmless for anyone
            // self-hosting (only skips caching of their own local file); production keeps the version-based cache.
            // v7.21.0 - asks isLocalServer() (stays "local server", not contributor — spec)
            script.src = 'dist/' + (isMobile ? 'mobile.js' : 'readerwrangler.js') + '?v=' + (isLocalServer() ? Date.now() : APP_VERSION);
            document.body.appendChild(script);

            // Dev-only mode indicator (localhost / file:// only — never ships to users). The desktop/mobile
            // switch has sticky session + desktopMode state, so on a phone-width viewport you can be looking
            // at desktop without realizing it. This chip flashes the current mode on vertical scroll, then
            // fades — visible when you move, out of the way when visualizing the actual UI at rest.
            // TAP it to toggle to the other mode (desktop<->mobile) — also the escape hatch from a stuck mode.
            (function () {
                if (!isContributor()) return; // v7.21.0 - developer aid → contributors only (was: localhost / file://)
                var narrow = window.matchMedia('(max-width: 767px)').matches;
                var modeLabel = isMobile ? 'MOBILE' : ('DESKTOP' + (narrow ? ' · phone width' : ''));
                var target = isMobile ? 'DESKTOP' : 'MOBILE'; // tapping toggles to the other mode
                var chipBg = narrow ? 'rgba(220,38,38,0.95)' : 'rgba(15,23,42,0.85)'; // red on any phone-width viewport
                var chip = document.createElement('div');
                chip.title = 'Tap to switch to ' + target + ' mode';
                // position:absolute + manual placement (not fixed): the desktop app overflows a phone-width
                // viewport, and fixed/left:50% resolves against that wide layout width, parking the chip
                // off-screen. Placing it in document coords centered on the *visible* area, updated on scroll,
                // keeps it centered on whatever you're actually looking at.
                chip.style.cssText = 'position:absolute;transform:translateX(-50%);' +
                    'z-index:2147483647;pointer-events:none;cursor:pointer;display:flex;align-items:center;gap:8px;' +
                    'background:' + chipBg + ';color:#fff;padding:3px 10px;border-radius:11px;' +
                    'border:1px solid rgba(255,255,255,0.5);box-shadow:0 2px 7px rgba(0,0,0,0.4);' +
                    'font:700 11px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:0.05em;white-space:nowrap;' +
                    'opacity:0;transition:opacity .25s;';
                var modeSeg = document.createElement('span');
                modeSeg.textContent = modeLabel;
                var actionSeg = document.createElement('span');
                actionSeg.textContent = '⇄ tap for ' + target;
                actionSeg.style.cssText = 'padding-left:8px;border-left:1px solid rgba(255,255,255,0.45);opacity:0.95;';
                chip.appendChild(modeSeg);
                chip.appendChild(actionSeg);
                (document.body || document.documentElement).appendChild(chip);
                function place() {
                    chip.style.left = (window.scrollX + window.innerWidth / 2) + 'px';
                    chip.style.top = (window.scrollY + 6) + 'px';
                }
                place();
                window.addEventListener('resize', place);
                var hideTimer;
                // Tappable only while visible: toggle pointer-events with opacity so an invisible chip never
                // intercepts taps over the real UI at rest.
                function show() {
                    place();
                    chip.style.opacity = '1';
                    chip.style.pointerEvents = 'auto';
                    clearTimeout(hideTimer);
                    hideTimer = setTimeout(function () { chip.style.opacity = '0'; chip.style.pointerEvents = 'none'; }, 1500);
                }
                window.addEventListener('scroll', show, true); // capture: catches inner-container scrolls (desktop) + window (mobile); also re-centers the chip
                chip.addEventListener('pointerenter', function () { clearTimeout(hideTimer); chip.style.opacity = '1'; chip.style.pointerEvents = 'auto'; });
                chip.addEventListener('pointerleave', show); // restart the fade once you move off
                chip.addEventListener('click', function () {
                    // Toggle to the other mode: force it via sessionMode, clear the persistent desktop flag.
                    localStorage.removeItem('readerwrangler-desktopMode');
                    sessionStorage.setItem('readerwrangler-sessionMode', isMobile ? 'desktop' : 'mobile');
                    location.reload();
                });
            })();
        }
    </script>
    <!-- Emergency reset fallback: offer reset if app fails to mount -->
    <!-- Skip timer if interstitial shown (no app code loaded) -->
    <script>
        if (window._appLoading) window._appMountTimer = setTimeout(function() {
            var splash = document.getElementById('splash');
            if (!splash) return; // React mounted and replaced splash — all good
            splash.innerHTML =
                '<div style="text-align:center; padding:40px 20px; max-width:400px;">' +
                    '<div style="font-size:2em; margin-bottom:16px;">&#9888;&#65039;</div>' +
                    '<div style="font-family:\'Libre Baskerville\',Georgia,serif; font-size:1.4em; font-weight:700; color:var(--text-primary,#1e293b); margin-bottom:12px;">Something went wrong</div>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.95em; line-height:1.6; margin-bottom:24px;">' +
                        'ReaderWrangler failed to load. This may be caused by damaged data. ' +
                        'You can reset the app to fix this. ' +
                        // 7.27.1 - a shared reset sentence, word for word (test/test_reset_words.py); no "save a backup
                        // first" tip here: a backup can't be saved from a library that didn't load
                        'Your saved backup files are not touched.' +
                    '</div>' +
                    (isLocalServer() && window._lastLoadError /* v7.21.0 - any local server: a self-hoster debugging a broken page needs it too */
                        ? '<pre style="text-align:left; background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:10px 12px; font-size:0.78em; color:#991b1b; white-space:pre-wrap; word-break:break-word; margin-bottom:20px;">' +
                          String(window._lastLoadError).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>'
                        : '') +
                    '<button id="emergencyResetBtn" style="padding:12px 24px; background:#dc2626; color:white; border:none; border-radius:8px; font-size:1em; font-weight:600; cursor:pointer; margin-bottom:12px;">Reset App</button>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.8em; margin-top:8px;">To get everything back afterwards: File → Restore Backup… with your backup file.</div>' +
                '</div>';
            // v7.4.0 - App-styled confirm (React is dead on this screen, but the stylesheet
            // isn't — a hand-rolled DOM dialog beats the native "localhost:8000 says" box)
            document.getElementById('emergencyResetBtn').addEventListener('click', function() {
                if (document.getElementById('emergencyConfirm')) return;
                var ov = document.createElement('div');
                ov.id = 'emergencyConfirm';
                ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10001;';
                ov.innerHTML =
                    '<div style="background:var(--bg-surface,#fff);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:24px 28px;max-width:400px;width:90%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">' +
                        '<div style="font-size:1.1em;font-weight:700;color:var(--text-primary,#1e293b);margin-bottom:10px;">Reset ReaderWrangler?</div>' +
                        '<div id="emergencyMsg" style="font-size:.9em;line-height:1.6;color:var(--text-muted,#64748b);margin-bottom:20px;">This clears your books, folders and settings from this browser.<br><br>Your saved backup files are not touched.<br><br>To get everything back afterwards: File → Restore Backup… with your backup file.</div>' +
                        '<div style="text-align:right;">' +
                            '<button id="emergencyCancelBtn" style="padding:9px 18px;background:var(--bg-surface,#fff);color:var(--text-primary,#334155);border:1px solid var(--border-default,#cbd5e1);border-radius:8px;font-size:.9em;font-weight:600;cursor:pointer;margin-right:8px;">Cancel</button>' +
                            '<button id="emergencyEraseBtn" style="padding:9px 18px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:.9em;font-weight:600;cursor:pointer;">Erase and Reset</button>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(ov);
                document.getElementById('emergencyCancelBtn').addEventListener('click', function() { ov.remove(); });
                document.getElementById('emergencyEraseBtn').addEventListener('click', function() {
                    var keys = ['readerwrangler-state','readerwrangler-enriched-cache','readerwrangler-settings','readerwrangler-status','readerwrangler-filters','readerwrangler-explorer','readerwrangler-folders','readerwrangler-mobile-prefs','readerwrangler-theme','readerwrangler-desktopMode'];
                    keys.forEach(function(k) { localStorage.removeItem(k); });
                    // 7.25.1 - storage.js's deleteBookStore (the one delete): a delete another tab blocks is WAITED for,
                    // saying why — reloading on "blocked" hung the reload behind the pending delete. (A raw delete only if
                    // storage.js itself failed to load.)
                    var reload = function() { location.reload(); };
                    var blocked = function() {
                        document.getElementById('emergencyMsg').textContent = (typeof BOOK_STORE_TEXT !== 'undefined')
                            ? BOOK_STORE_TEXT.blocked : 'Close your other ReaderWrangler tabs to finish the reset.';
                        document.getElementById('emergencyEraseBtn').disabled = true;
                    };
                    if (typeof deleteBookStore === 'function') {
                        deleteBookStore({ onBlocked: blocked }).then(reload, reload);
                    } else {
                        var req = indexedDB.deleteDatabase('ReaderWranglerDB');
                        req.onsuccess = req.onerror = reload;
                        req.onblocked = blocked;
                    }
                });
            });
        }, window._appTimeout || 15000);
    </script>
    <script data-goatcounter="https://readerwrangler.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
